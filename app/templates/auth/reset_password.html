{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-5">
        <div class="card shadow-lg border-0 rounded-4">
            <div class="card-body p-4">
                <h3 class="fw-bold text-primary text-center mb-1">Set New Password</h3>
                <p class="text-muted small text-center mb-4">Create a new secure password for your account.</p>

                <form method="POST" action="">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">New Password *</label>
                        <input type="password" name="password" class="form-control" placeholder="Enter new password" required minlength="6">
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Confirm New Password *</label>
                        <input type="password" name="confirm_password" class="form-control" placeholder="Confirm new password" required minlength="6">
                    </div>

                    <button type="submit" class="btn btn-success btn-lg w-100 fw-bold">
                        Reset Password
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
