{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-5">
        <div class="card shadow-lg border-0 rounded-4">
            <div class="card-body p-4 text-center">
                <i class="bi bi-shield-lock text-primary display-4 mb-2"></i>
                <h3 class="fw-bold text-primary mb-1">Forgot Password?</h3>
                <p class="text-muted small mb-4">Enter your registered email to receive password reset link.</p>

                <form method="POST" action="">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    <div class="mb-3 text-start">
                        <label class="form-label fw-bold">Email Address *</label>
                        <input type="email" name="email" class="form-control" placeholder="name@example.com" required>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold mb-3">
                        Send Reset Link
                    </button>
                    
                    <div>
                        <a href="{{ url_for('auth.login') }}" class="text-decoration-none text-secondary small">
                            <i class="bi bi-arrow-left me-1"></i> Back to Login
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
