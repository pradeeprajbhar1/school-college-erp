<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Online Admission Form - {{ title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-lg border-0">
                    <div class="card-header bg-primary text-white text-center py-3">
                        <h3 class="fw-bold mb-0">Online Admission Form</h3>
                        <p class="mb-0 small">Apply for Academic Session 2026-2027</p>
                    </div>
                    <div class="card-body p-4">
                        {% with messages = get_flashed_messages(with_categories=true) %}
                            {% if messages %}
                                {% for category, message in messages %}
                                    <div class="alert alert-{{ category }}">{{ message }}</div>
                                {% endfor %}
                            {% endif %}
                        {% endwith %}

                        <form method="POST" action="">
                            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Full Name *</label>
                                <input type="text" name="applicant_name" class="form-control" required placeholder="e.g. Rahul Sharma">
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Mobile / WhatsApp Number *</label>
                                <input type="text" name="phone" class="form-control" required placeholder="10-digit phone number">
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Email Address *</label>
                                <input type="email" name="email" class="form-control" required placeholder="student@example.com">
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Course / Class Applied For *</label>
                                <input type="text" name="course_applied" class="form-control" required placeholder="e.g. Class 11th Science / B.Tech CSE">
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Additional Remarks / Questions</label>
                                <textarea name="notes" class="form-control" rows="2"></textarea>
                            </div>
                            <button type="submit" class="btn btn-success btn-lg w-100 fw-bold">Submit Application Inquiry</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
