{% extends "base.html" %}

{% block content %}
<div class="row mb-4">
    <div class="col-12">
        <h3 class="text-primary fw-bold">Edit Student</h3>
        <a href="{{ url_for('students.index') }}" class="text-decoration-none"><i class="bi bi-arrow-left"></i> Back to Directory</a>
    </div>
</div>

<div class="card shadow-sm border-0">
    <div class="card-body p-4">
        <form method="POST" action="">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            
            <div class="row mb-3">
                <div class="col-md-4">
                    <label class="form-label">Admission Number *</label>
                    <input type="text" name="admission_number" class="form-control" value="{{ student.admission_number }}" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">First Name *</label>
                    <input type="text" name="first_name" class="form-control" value="{{ student.first_name }}" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Last Name *</label>
                    <input type="text" name="last_name" class="form-control" value="{{ student.last_name }}" required>
                </div>
            </div>
            
            <div class="row mb-4">
                <div class="col-md-3">
                    <label class="form-label">Gender</label>
                    <select name="gender" class="form-select">
                        <option value="Male" {% if student.gender == 'Male' %}selected{% endif %}>Male</option>
                        <option value="Female" {% if student.gender == 'Female' %}selected{% endif %}>Female</option>
                        <option value="Other" {% if student.gender == 'Other' %}selected{% endif %}>Other</option>
                    </select>
                </div>
                
                <div class="col-md-3">
                    <label class="form-label">Class</label>
                    <select name="class_id" class="form-select">
                        <option value="">Select Class...</option>
                        {% for c in classes %}
                            <option value="{{ c.id }}" {% if student.class_id == c.id %}selected{% endif %}>{{ c.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="col-md-3">
                    <label class="form-label">Guardian Name</label>
                    <input type="text" name="guardian_name" class="form-control" value="{{ student.guardian_name }}">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Contact Number</label>
                    <input type="text" name="contact_number" class="form-control" value="{{ student.contact_number }}">
                </div>
            </div>

            <div class="row mb-4">
                <div class="col-md-3">
                    <label class="form-label">Status</label>
                    <select name="status" class="form-select">
                        <option value="Active" {% if student.status == 'Active' %}selected{% endif %}>Active</option>
                        <option value="Suspended" {% if student.status == 'Suspended' %}selected{% endif %}>Suspended</option>
                        <option value="Withdrawn" {% if student.status == 'Withdrawn' %}selected{% endif %}>Withdrawn</option>
                        <option value="Graduated" {% if student.status == 'Graduated' %}selected{% endif %}>Graduated</option>
                    </select>
                </div>
            </div>
            
            <div class="text-end">
                <button type="submit" class="btn btn-primary px-4">Update Student</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
